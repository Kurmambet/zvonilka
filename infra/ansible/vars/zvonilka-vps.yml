---
admin_user: devops
admin_ssh_public_keys: []
deploy_user: deploy
deploy_ssh_public_keys: []
ssh_allow_users: ["{{ admin_user }}"]
docker_users: []
docker_prune_enabled: false
certbot_email: ""
certbot_staging: false
zvonilka_path: /opt/zvonilka-staging
nginx_sites:
  - name: api.zvonilka.website
    server_names: [api.zvonilka.website]
    canonical_host: api.zvonilka.website
    tls: true
    locations:
      - path: "= /api/v1/auth/register"
        return_status: 404
      - path: "= /api/v1/auth/register/"
        return_status: 404
      - path: "= /api/v1/rooms"
        proxy_pass: http://127.0.0.1:8002
      - path: /api/v1/rooms/
        proxy_pass: http://127.0.0.1:8002
        websocket: true
        timeout: 120s
        access_log: false
      - path: /
        proxy_pass: http://127.0.0.1:8002
