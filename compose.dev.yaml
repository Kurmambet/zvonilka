name: zvonilka-dev

x-backend: &backend
  image: zvonilka-backend:dev
  build:
    context: .
    dockerfile: zvonilka/backend/Dockerfile
  environment:
    ZVONILKA_DATABASE_URL: "postgresql+asyncpg://zvonilka:local_dev_only@postgres:5432/zvonilka"
    ZVONILKA_DATABASE_SCHEMA: "public"
    ZVONILKA_REDIS_URL: "redis://redis:6379/0"
    ZVONILKA_JWT_SECRET: "${ZVONILKA_DEV_JWT_SECRET:?Set ZVONILKA_DEV_JWT_SECRET in .env.compose.local}"
    ZVONILKA_ACCESS_TTL_SECONDS: "${ZVONILKA_DEV_ACCESS_TTL_SECONDS:-600}"
    ZVONILKA_ROOM_REGISTRY_KEY: "${ZVONILKA_DEV_ROOM_REGISTRY_KEY:-zvonilka:compose:rooms}"
    ZVONILKA_RATE_LIMIT_PREFIX: "${ZVONILKA_DEV_RATE_LIMIT_PREFIX:-zvonilka:compose:rate}"
    ZVONILKA_ENVIRONMENT: "${ZVONILKA_ENVIRONMENT:-dev}"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zvonilka
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: zvonilka
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zvonilka -d zvonilka"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8000"
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data: {}
